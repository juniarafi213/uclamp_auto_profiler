name: Build & Release Module

on:
  push:
    branches: [ main, master, encore-fas ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cross-compilation toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools clang lld zip

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Build Rust Daemon (uclampd)
        run: |
          mkdir -p bin
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc \
            cargo build --release --target aarch64-unknown-linux-musl --manifest-path uclampd/Cargo.toml
          cp uclampd/target/aarch64-unknown-linux-musl/release/uclampd bin/uclampd
          aarch64-linux-gnu-strip bin/uclampd
          chmod 755 bin/uclampd
          ls -lh bin/uclampd

      - name: Build Encore FAS Governor
        run: |
          clang --target=aarch64-linux-gnu -fuse-ld=lld -nostdlib -static -O2 -fno-builtin -fno-stack-protector \
            src/fas_governor.c -o bin/fas_governor
          llvm-strip bin/fas_governor
          chmod 755 bin/fas_governor
          ls -lh bin/fas_governor

      - name: Package KernelSU Module ZIP
        run: |
          bash build.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uclamp_auto_profiler
          path: uclamp_auto_profiler.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: uclamp_auto_profiler.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
